# Frontend CI: every push to main and every pull request.
# CLAUDE.md: CI blocks merge on any failing test (turn on branch protection
# for main and require this workflow's "web" check).
name: web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Unit and component tests (coverage at least 70%)
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

      - name: No mock data in the production build
        run: pnpm check:no-mock-data

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Runs on the dev server with MSW mocks on, until the backend exists.
      - name: End-to-end tests (375px and desktop)
        run: pnpm test:e2e
        env:
          CI: "true"

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
